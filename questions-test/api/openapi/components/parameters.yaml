IdParam:
  name: id
  in: path
  required: true
  description: ID question
  schema:
    type: string
    example: q_01j9x7t3f5a2b3c4d5e6f7g8h9
PageParam:
  name: page
  in: query
  required: false
  schema:
    type: integer
    minimum: 1
    default: 1
LimitParam:
  name: limit
  in: query
  required: false
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 10
SearchParam:
  name: search
  in: query
  required: false
  schema:
    type: string
