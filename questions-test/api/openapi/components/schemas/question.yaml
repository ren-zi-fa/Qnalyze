Question:
  type: object
  description: >-
    Soal di bank soal. Field answer dan explanation hanya dikirim
    untuk tampilan admin; saat pengerjaan peserta, keduanya
    disembunyikan oleh endpoint yang berbeda.
  required:
    - id
    - code
    - text
    - categoryId
    - type
    - difficulty
    - status
    - options
    - answer
    - createdAt
    - updatedAt
  properties:
    id:
      type: integer
      example: 1
    code:
      type: string
      description: Kode unik soal
      example: Q-LG-001
    text:
      type: string
      description: Pertanyaan
      example: Apa ibu kota Indonesia?
    categoryId:
      type: integer
      description: Kategori tempat soal berada
      example: 3
    type:
      type: string
      description: Tipe soal
      enum:
        - Pilihan Ganda
        - Benar/Salah
        - Isian Singkat
      example: Pilihan Ganda
    difficulty:
      type: string
      description: Tingkat kesulitan
      enum:
        - Mudah
        - Sedang
        - Sulit
      example: Mudah
    status:
      type: string
      description: Status terbit
      enum:
        - Terbit
        - Draf
      example: Terbit
    options:
      type: array
      description: Daftar opsi jawaban
      items:
        type: object
        required:
          - key
          - text
        properties:
          key:
            type: string
            example: A
          text:
            type: string
            example: Jakarta
    answer:
      type: string
      description: Kunci jawaban (hanya untuk tampilan admin)
      example: A
    explanation:
      type: string
      description: Pembahasan jawaban
      example: Jakarta adalah ibu kota Indonesia.
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

CreateQuestionRequest:
  type: object
  required:
    - code
    - text
    - categoryId
    - type
    - difficulty
    - options
    - answer
  properties:
    code:
      type: string
      example: Q-LG-001
    text:
      type: string
      example: Apa ibu kota Indonesia?
    categoryId:
      type: integer
      example: 3
    type:
      type: string
      enum:
        - Pilihan Ganda
        - Benar/Salah
        - Isian Singkat
      example: Pilihan Ganda
    difficulty:
      type: string
      enum:
        - Mudah
        - Sedang
        - Sulit
      example: Mudah
    status:
      type: string
      description: Kosong = Draf
      enum:
        - Terbit
        - Draf
      example: Draf
    options:
      type: array
      items:
        type: object
        required:
          - key
          - text
        properties:
          key:
            type: string
            example: A
          text:
            type: string
            example: Jakarta
    answer:
      type: string
      example: A
    explanation:
      type: string
      example: Jakarta adalah ibu kota Indonesia.

