RegisterRequest:
  type: object
  required:
    - email
    - password
  properties:
    name:
      type: string
      example: Renzi
    email:
      type: string
      format: email
      example: renzi@example.com
    password:
      type: string
      format: password
      minLength: 8
      example: secret123

LoginRequest:
  type: object
  required:
    - email
    - password
  properties:
    email:
      type: string
      format: email
      example: renzi@example.com
    password:
      type: string
      format: password
      example: secret123

AuthResponse:
  type: object
  required:
    - user
  properties:
    user:
      $ref: ./user.yaml#/User
      description: Data user. Session dibuat di sisi server dan dikirim via cookie `Set-Cookie`.
