User:
  type: object
  required:
    - id
    - email
  properties:
    id:
      type: integer
      example: 1
    name:
      type: [string, "null"]
      example: Renzi
    email:
      type: string
      format: email
      example: renzi@example.com
    createdAt:
      type: string
      format: date-time

AdminUser:
  type: object
  description: Profil pengguna untuk tampilan admin, lengkap dengan peran dan status.
  required:
    - id
    - email
    - role
    - status
    - joinedAt
    - lastActive
  properties:
    id:
      type: integer
      example: 1
    name:
      type: [string, "null"]
      example: Renzi
    email:
      type: string
      format: email
      example: renzi@example.com
    role:
      type: string
      description: Peran pengguna
      enum:
        - Admin
        - Guru
        - Siswa
      example: Siswa
    status:
      type: string
      description: Status akun
      enum:
        - Aktif
        - Nonaktif
      example: Aktif
    joinedAt:
      type: string
      format: date-time
    lastActive:
      type: [string, "null"]
      format: date-time

UpdateUserRequest:
  type: object
  description: Ubah peran atau status pengguna. Field yang tidak dikirim tidak diubah.
  properties:
    role:
      type: string
      enum:
        - Admin
        - Guru
        - Siswa
      example: Guru
    status:
      type: string
      enum:
        - Aktif
        - Nonaktif
      example: Nonaktif
