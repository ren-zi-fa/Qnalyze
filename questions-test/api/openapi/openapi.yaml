openapi: 3.2.0
info:
  title: Qnalyze Questions Test API
  version: 1.0.0
  description: Kerangka awal API questions-test. Auth berbasis cookie session, resource utama Questions.
servers:
  - url: http://localhost:3100
    description: Local development
tags:
  - name: Health
    description: Cek status service
  - name: Auth
    description: Register dan login
  - name: Users
    description: Profil user yang sedang login dan kelola pengguna
  - name: Questions
    description: CRUD questions
  - name: Categories
    description: Kelola kategori soal
  - name: Attempts
    description: Pengerjaan soal oleh peserta
  - name: Submissions
    description: Hasil pengerjaan
  - name: Stats
    description: Statistik dan rekap
paths:
  /api/health:
    $ref: ./paths/health.yaml
  /api/auth/register:
    $ref: ./paths/auth/register.yaml
  /api/auth/login:
    $ref: ./paths/auth/login.yaml
  /api/auth/logout:
    $ref: ./paths/auth/logout.yaml
  /api/users/me:
    $ref: ./paths/users/me.yaml
  /api/questions:
    $ref: ./paths/questions/collection.yaml
  /api/questions/public:
    $ref: ./paths/questions/public.yaml
  /api/questions/{id}:
    $ref: ./paths/questions/by-id.yaml
  /api/questions/import:
    $ref: ./paths/questions/import.yaml
  /api/questions/import/preview:
    $ref: ./paths/questions/import-preview.yaml
  /api/questions/{id}/duplicate:
    $ref: ./paths/questions/duplicate.yaml
  /api/categories:
    $ref: ./paths/categories/collection.yaml
  /api/categories/public:
    $ref: ./paths/categories/public.yaml
  /api/categories/{id}:
    $ref: ./paths/categories/by-id.yaml
  /api/attempts:
    $ref: ./paths/attempts/start.yaml
  /api/attempts/{id}:
    $ref: ./paths/attempts/by-id.yaml
  /api/attempts/{id}/answers:
    $ref: ./paths/attempts/answers.yaml
  /api/submissions:
    $ref: ./paths/submissions/collection.yaml
  /api/users:
    $ref: ./paths/users/list.yaml
  /api/users/{id}:
    $ref: ./paths/users/update.yaml
  /api/stats/me:
    $ref: ./paths/stats/me.yaml
  /api/stats/admin:
    $ref: ./paths/stats/admin.yaml
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid
      description: Cookie session yang dikirim otomatis oleh browser setelah login
  parameters:
    IdParam:
      $ref: ./components/parameters.yaml#/IdParam
    PageParam:
      $ref: ./components/parameters.yaml#/PageParam
    LimitParam:
      $ref: ./components/parameters.yaml#/LimitParam
    SearchParam:
      $ref: ./components/parameters.yaml#/SearchParam
  responses:
    Unauthorized:
      $ref: ./components/responses.yaml#/Unauthorized
    NotFound:
      $ref: ./components/responses.yaml#/NotFound
    ValidationError:
      $ref: ./components/responses.yaml#/ValidationError
  schemas:
    HealthResponse:
      $ref: ./components/schemas/common.yaml#/HealthResponse
    Error:
      $ref: ./components/schemas/common.yaml#/Error
    RegisterRequest:
      $ref: ./components/schemas/auth.yaml#/RegisterRequest
    LoginRequest:
      $ref: ./components/schemas/auth.yaml#/LoginRequest
    AuthResponse:
      $ref: ./components/schemas/auth.yaml#/AuthResponse
    User:
      $ref: ./components/schemas/user.yaml#/User
    Question:
      $ref: ./components/schemas/question.yaml#/Question
    CreateQuestionRequest:
      $ref: ./components/schemas/question.yaml#/CreateQuestionRequest
    UpdateQuestionRequest:
      $ref: ./components/schemas/question.yaml#/UpdateQuestionRequest
    ImportQuestionsResponse:
      $ref: ./components/schemas/question.yaml#/ImportQuestionsResponse
    PaginatedQuestions:
      $ref: ./components/schemas/question.yaml#/PaginatedQuestions
    PublicQuestion:
      $ref: ./components/schemas/question.yaml#/PublicQuestion
    PaginatedPublicQuestions:
      $ref: ./components/schemas/question.yaml#/PaginatedPublicQuestions
    Category:
      $ref: ./components/schemas/category.yaml#/Category
    CategoriesResponse:
      $ref: ./components/schemas/category.yaml#/CategoriesResponse
    CreateCategoryRequest:
      $ref: ./components/schemas/category.yaml#/CreateCategoryRequest
    UpdateCategoryRequest:
      $ref: ./components/schemas/category.yaml#/UpdateCategoryRequest
    Attempt:
      $ref: ./components/schemas/attempt.yaml#/Attempt
    AttemptQuestion:
      $ref: ./components/schemas/attempt.yaml#/AttemptQuestion
    StartAttemptRequest:
      $ref: ./components/schemas/attempt.yaml#/StartAttemptRequest
    SubmitAttemptAnswersRequest:
      $ref: ./components/schemas/attempt.yaml#/SubmitAttemptAnswersRequest
    SaveAttemptAnswersRequest:
      $ref: ./components/schemas/attempt.yaml#/SaveAttemptAnswersRequest
    AdminUser:
      $ref: ./components/schemas/user.yaml#/AdminUser
    UpdateUserRequest:
      $ref: ./components/schemas/user.yaml#/UpdateUserRequest
    Submission:
      $ref: ./components/schemas/submission.yaml#/Submission
    PaginatedSubmissions:
      $ref: ./components/schemas/submission.yaml#/PaginatedSubmissions
    StatsMe:
      $ref: ./components/schemas/stats.yaml#/StatsMe
    StatsAdmin:
      $ref: ./components/schemas/stats.yaml#/StatsAdmin
security:
  - cookieAuth: []
