patch:
  tags:
    - Attempts
  summary: Simpan jawaban sementara
  operationId: saveAttemptAnswers
  description: >-
    Menyimpan satu atau beberapa jawaban pada sesi yang masih berlangsung
    tanpa mengakhiri pengerjaan. Jawaban dengan questionId yang sama
    akan diperbarui, sedangkan jawaban lain tetap dipertahankan.

    Tidak memerlukan autentikasi (attempt boleh dimulai sebagai anonim).
    Bila cookie sesi dikirim, kepemilikan attempt ikut diverifikasi.
  security: []
  parameters:
    - $ref: ../../components/parameters.yaml#/IdParam
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/attempt.yaml#/SaveAttemptAnswersRequest
  responses:
    "200":
      description: Jawaban sementara berhasil disimpan
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/attempt.yaml#/Attempt
    "400":
      $ref: ../../components/responses.yaml#/ValidationError
    "404":
      $ref: ../../components/responses.yaml#/NotFound
    "409":
      description: Sesi sudah selesai
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/common.yaml#/Error
post:
  tags:
    - Attempts
  summary: Kumpulkan jawaban dan akhiri pengerjaan
  security: []
  operationId: submitAttemptAnswers
  description: >-
    Seluruh jawaban dikirim sekaligus. Server menghitung skor,
    menutup sesi, dan mengembalikan hasil beserta kunci jawaban
    dan pembahasan.
  parameters:
    - $ref: ../../components/parameters.yaml#/IdParam
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/attempt.yaml#/SubmitAttemptAnswersRequest
  responses:
    "200":
      description: Pengerjaan selesai, hasil dikirim
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/attempt.yaml#/Attempt
    "400":
      $ref: ../../components/responses.yaml#/ValidationError
    "404":
      $ref: ../../components/responses.yaml#/NotFound
    "409":
      description: Pengerjaan sudah diselesaikan sebelumnya
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/common.yaml#/Error
