post:
  tags:
    - Attempts
  summary: Mulai pengerjaan soal
  security: []
  operationId: startAttempt
  description: >-
    Membuat sesi pengerjaan dan mengembalikan paket soal TANPA
    kunci jawaban dan pembahasan. Keduanya baru dikirim setelah
    pengerjaan selesai.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/attempt.yaml#/StartAttemptRequest
  responses:
    "201":
      description: Sesi pengerjaan dimulai
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/attempt.yaml#/Attempt
    "400":
      $ref: ../../components/responses.yaml#/ValidationError
    "404":
      $ref: ../../components/responses.yaml#/NotFound
