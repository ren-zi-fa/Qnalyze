post:
  tags:
    - Auth
  summary: Daftarkan user baru
  operationId: registerUser
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/auth.yaml#/RegisterRequest
  responses:
    "201":
      description: User berhasil dibuat dan session dibuat via cookie
      headers:
        Set-Cookie:
          description: Cookie session (HttpOnly, Secure, SameSite). Session ID disimpan di sisi server.
          schema:
            type: string
            example: sid=abc123; HttpOnly; Secure; SameSite=Lax; Path=/
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/auth.yaml#/AuthResponse
    "400":
      $ref: ../../components/responses.yaml#/ValidationError
    "409":
      description: Email sudah terdaftar
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/common.yaml#/Error
