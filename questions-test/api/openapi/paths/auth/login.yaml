post:
  tags:
    - Auth
  summary: Login dan buat session cookie
  operationId: loginUser
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/auth.yaml#/LoginRequest
  responses:
    "200":
      description: Login berhasil, session dibuat dan dikirim via cookie
      headers:
        Set-Cookie:
          description: Cookie session (HttpOnly, Secure, SameSite). Session ID disimpan di sisi server.
          schema:
            type: string
            example: sid=abc123; HttpOnly; Secure; SameSite=Lax; Path=/
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/auth.yaml#/AuthResponse
    "400":
      $ref: ../../components/responses.yaml#/ValidationError
    "401":
      $ref: ../../components/responses.yaml#/Unauthorized
