version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # API (pnpm)
  - package-ecosystem: "npm"
    directory: "/questions-test/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # UI (pnpm)
  - package-ecosystem: "npm"
    directory: "/questions-test/ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Docker images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Docker images (API)
  - package-ecosystem: "docker"
    directory: "/questions-test/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Docker images (UI)
  - package-ecosystem: "docker"
    directory: "/questions-test/ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
