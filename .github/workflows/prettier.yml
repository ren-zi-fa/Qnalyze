name: Prettier Check

on:
  push:
    paths:
      - "questions-test/**"
      - ".github/workflows/prettier.yml"
  pull_request:
    paths:
      - "questions-test/**"
      - ".github/workflows/prettier.yml"

jobs:
  prettier:
    name: Prettier check (questions-test/api)
    runs-on: ubuntu-latest

    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

    defaults:
      run:
        working-directory: questions-test/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        shell: bash
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 "$GITHUB_SHA")"
          fi

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            changed_files="$(git diff --name-only "$BASE_SHA"...HEAD -- .)"
          else
            changed_files="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- .)"
          fi

          mapfile -t files < <(
            printf '%s\n' "$changed_files" |
              sed 's#^questions-test/api/##' |
              grep -E '\.(cjs|css|graphql|html|js|jsx|json|jsonc|md|mdx|mjs|scss|ts|tsx|yaml|yml)$' || true
          )

          if (( ${#files[@]} == 0 )); then
            echo "No supported API files changed; skipping Prettier check."
            exit 0
          fi

          pnpm exec prettier --check "${files[@]}"
